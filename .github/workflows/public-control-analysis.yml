name: public-control-analysis

on:
  push:
    paths:
      - ".github/workflows/public-control-analysis.yml"
      - "scripts/run_public_control_analysis.py"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project and data client
        run: |
          pip install -e ".[dev]"
          pip install "huggingface_hub>=0.27" "pyarrow>=17"
      - name: Download public EDGAR-derived filing metadata
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="ZipLime/sec-8k-events",
              repo_type="dataset",
              local_dir="/tmp/sec-8k-events",
              allow_patterns=[
                  "data/filings/*.parquet",
                  "data/cyber_events/*.parquet",
              ],
          )
          PY
      - name: Run matched-firm control analysis
        run: python scripts/run_public_control_analysis.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: public-control-analysis
          retention-days: 30
          if-no-files-found: error
          path: results/public_control/
