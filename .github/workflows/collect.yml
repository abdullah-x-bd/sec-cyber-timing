name: collect-sec-sample

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Check SEC user agent
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "SEC_USER_AGENT repository secret is required."
            exit 1
          fi

      - name: Collect SEC bulk submissions
        run: python scripts/collect_sec.py

      - name: Build filing sample
        run: python scripts/build_filing_sample.py

      - name: Cache Item 1.05 filing documents
        run: python scripts/fetch_filing_docs.py

      - name: Extract materiality date candidates
        run: python scripts/extract_materiality_dates.py

      - name: Build validation queue
        run: python scripts/build_validation_queue.py

      - name: Package discovery dataset
        uses: actions/upload-artifact@v4
        with:
          name: sec-cyber-discovery
          if-no-files-found: error
          retention-days: 30
          path: |
            data/interim/filing_universe.csv
            data/interim/item_105_filings.csv
            data/interim/matched_firm_8k_controls.csv
            data/interim/materiality_date_candidates.csv
            data/interim/validation_queue.csv
            data/raw/sec/filings/*.html
