[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-cyber-timing"
version = "0.1.0"
description = "Reproducible study of the timing of SEC cybersecurity incident disclosures"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "pandas-market-calendars>=4.4",
  "pyyaml>=6.0",
  "requests>=2.32",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
